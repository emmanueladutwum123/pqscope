name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt-check vet staticcheck
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - run: make build
      - run: ./bin/pqscope version
      - name: Policy gate passes on post-quantum code and fails on classical code
        run: |
          ./bin/pqscope scan testdata/policy/pq-only -o "$RUNNER_TEMP/pq.cdx.json"
          ./bin/pqscope policy "$RUNNER_TEMP/pq.cdx.json"
          ./bin/pqscope scan testdata/policy/classical -o "$RUNNER_TEMP/classical.cdx.json"
          code=0
          ./bin/pqscope policy "$RUNNER_TEMP/classical.cdx.json" || code=$?
          test "$code" -eq 1
