name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt-check vet staticcheck
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Paper numbers match paper/data, and none is typed by hand
        run: make paper-check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Network probes against OpenSSL 3.5, Go and OpenSSH servers in Docker
        run: make integration
        env:
          PQSCOPE_REQUIRE_DOCKER: "1"
      - name: Benchmark pipeline, with sizes cross-checked against OpenSSL 3.5 (few iterations)
        run: |
          NETEM_N=3 NETEM_N_LOSS=3 bench/run.sh "$RUNNER_TEMP/bench"
          test -s "$RUNNER_TEMP/bench/openssl/version.txt"
          go run ./cmd/pqscope bench --quick --runs "$RUNNER_TEMP/bench" --out "$RUNNER_TEMP/rq4"
          grep -q '^openssl,version,' "$RUNNER_TEMP/rq4/rq4_environment.csv"
          test "$(grep -c '^docker-linux,' "$RUNNER_TEMP/rq4/rq4_tls.csv")" -eq 36

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - run: make build
      - run: ./bin/pqscope version
      - name: Evaluation pipeline scores the corpus and cross-checks itself
        run: |
          ./bin/pqscope eval --runs "$RUNNER_TEMP/no-runs" --out "$RUNNER_TEMP/rq1"
          python3 eval/score.py "$RUNNER_TEMP/rq1"
      - name: Policy gate passes on post-quantum code and fails on classical code
        run: |
          ./bin/pqscope scan testdata/policy/pq-only -o "$RUNNER_TEMP/pq.cdx.json"
          ./bin/pqscope policy "$RUNNER_TEMP/pq.cdx.json"
          ./bin/pqscope scan testdata/policy/classical -o "$RUNNER_TEMP/classical.cdx.json"
          code=0
          ./bin/pqscope policy "$RUNNER_TEMP/classical.cdx.json" || code=$?
          test "$code" -eq 1

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Action reports without failing by default
        id: report
        uses: ./
        with:
          path: testdata/policy/classical
          sarif: classical.sarif
          upload: "false"
      - name: Outputs and repository-relative SARIF paths
        env:
          FINDINGS: ${{ steps.report.outputs.findings }}
          SARIF: ${{ steps.report.outputs.sarif }}
        run: |
          test "$FINDINGS" -gt 0
          python3 - "$SARIF" <<'PY'
          import json, sys
          uris = [l["physicalLocation"]["artifactLocation"]["uri"]
                  for r in json.load(open(sys.argv[1]))["runs"][0]["results"] for l in r["locations"] if "physicalLocation" in l]
          assert uris and all(u.startswith("testdata/policy/classical/") for u in uris), uris
          PY
      - name: Gate passes on post-quantum code
        uses: ./
        with:
          path: testdata/policy/pq-only
          upload: "false"
          fail-on: disallowed-2035
      - name: Gate fails on classical code
        id: gate
        continue-on-error: true
        uses: ./
        with:
          path: testdata/policy/classical
          upload: "false"
          fail-on: disallowed-2035
      - name: The failing gate failed
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: test "$OUTCOME" = failure
