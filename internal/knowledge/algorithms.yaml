# Algorithm knowledge DB. Every entry must cite at least one key of `sources`;
# the loader rejects entries that do not.
#
# classical_bits is the strength against classical attack:
#   - Public-key and symmetric values follow SP 800-57 Part 1 Rev. 5, Tables 2-3.
#   - PQC values are the bit strength of the AES/SHA target defining the FIPS
#     security category (1 or 2 = 128, 3 = 192, 5 = 256). They are category
#     equivalents, not attack-cost estimates.
#   - A hybrid takes the strongest component, because an attacker must break all
#     of them.
#   - Broken primitives take the best published attack cost where one exists.
#   - 0 means no single figure is assigned here.
#
# Sizes are in bytes. RSA public_key is the raw modulus length, not an encoded
# SubjectPublicKeyInfo. EC public_key is the uncompressed SEC 1 point. Hybrid
# public_key and ciphertext are the TLS client and server key shares.
#
# replacement is required for vulnerable and broken-now entries, per primitive.
# civilian and cnsa2 name other entries by id; the loader checks they resolve.
#
# curve names the elliptic curve in the std-curves catalogue
# (https://neuromancer.sk/std/, source https://github.com/J08nY/std-curves), which
# CycloneDX 1.6 recommends for cryptoProperties.algorithmProperties.curve.
version: 1

sources:
  ir8547: {title: "NIST IR 8547, Transition to Post-Quantum Cryptography Standards (final, 2026-10-27)", url: "https://csrc.nist.gov/pubs/ir/8547/final"}
  fips203: {title: "FIPS 203, ML-KEM", url: "https://csrc.nist.gov/pubs/fips/203/final"}
  fips204: {title: "FIPS 204, ML-DSA", url: "https://csrc.nist.gov/pubs/fips/204/final"}
  fips205: {title: "FIPS 205, SLH-DSA", url: "https://csrc.nist.gov/pubs/fips/205/final"}
  fips186-5: {title: "FIPS 186-5, Digital Signature Standard", url: "https://csrc.nist.gov/pubs/fips/186-5/final"}
  fips197: {title: "FIPS 197, AES", url: "https://csrc.nist.gov/pubs/fips/197/final"}
  fips180-4: {title: "FIPS 180-4, Secure Hash Standard", url: "https://csrc.nist.gov/pubs/fips/180-4/upd1/final"}
  fips202: {title: "FIPS 202, SHA-3", url: "https://csrc.nist.gov/pubs/fips/202/final"}
  fips198-1: {title: "FIPS 198-1, HMAC", url: "https://csrc.nist.gov/pubs/fips/198-1/final"}
  sp800-57: {title: "SP 800-57 Part 1 Rev. 5, Recommendation for Key Management", url: "https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final"}
  sp800-56a: {title: "SP 800-56A Rev. 3, Discrete Logarithm-Based Key Establishment", url: "https://csrc.nist.gov/pubs/sp/800/56/a/r3/final"}
  sp800-131a: {title: "SP 800-131A Rev. 2, Transitioning Cryptographic Algorithms and Key Lengths", url: "https://csrc.nist.gov/pubs/sp/800/131/a/r2/final"}
  rfc6151: {title: "RFC 6151, Updated Security Considerations for MD5", url: "https://www.rfc-editor.org/rfc/rfc6151"}
  rfc7465: {title: "RFC 7465, Prohibiting RC4 Cipher Suites", url: "https://www.rfc-editor.org/rfc/rfc7465"}
  rfc7748: {title: "RFC 7748, Elliptic Curves for Security (X25519, X448)", url: "https://www.rfc-editor.org/rfc/rfc7748"}
  rfc7919: {title: "RFC 7919, Negotiated FFDHE Parameters for TLS", url: "https://www.rfc-editor.org/rfc/rfc7919"}
  rfc8017: {title: "RFC 8017, PKCS #1 v2.2 (RSA)", url: "https://www.rfc-editor.org/rfc/rfc8017"}
  rfc8032: {title: "RFC 8032, EdDSA", url: "https://www.rfc-editor.org/rfc/rfc8032"}
  rfc8439: {title: "RFC 8439, ChaCha20 and Poly1305", url: "https://www.rfc-editor.org/rfc/rfc8439"}
  shattered: {title: "Stevens et al., The First Collision for Full SHA-1 (2017)", url: "https://shattered.io/"}
  tls-ecdhe-mlkem: {title: "draft-ietf-tls-ecdhe-mlkem, Post-quantum hybrid ECDHE-MLKEM Key Agreement for TLS 1.3", url: "https://datatracker.ietf.org/doc/draft-ietf-tls-ecdhe-mlkem/"}
  ssh-mlkem: {title: "draft-ietf-sshm-mlkem-hybrid-kex, PQ/T Hybrid Key Exchange with ML-KEM in SSH", url: "https://datatracker.ietf.org/doc/draft-ietf-sshm-mlkem-hybrid-kex/"}
  ssh-ntruprime: {title: "draft-ietf-sshm-ntruprime-ssh, Secure Shell Key Exchange Method Using sntrup761 and X25519", url: "https://datatracker.ietf.org/doc/draft-ietf-sshm-ntruprime-ssh/"}
  cnsa2: {title: "draft-becker-cnsa2-tls-profile-05, CNSA 2.0 TLS Profile (secondary statement of the NSA suite)", url: "https://www.ietf.org/archive/id/draft-becker-cnsa2-tls-profile-05.html"}

entries:
  # --- RSA ---
  - &rsa
    id: RSA-1024
    algorithm: RSA
    params: "1024"
    primitives: [signature, pke]
    classical_bits: 80
    quantum: vulnerable
    sizes: {public_key: 128, signature: 128, ciphertext: 128}
    replacement: &rsa_replacement
      signature: {civilian: ML-DSA-65, cnsa2: ML-DSA-87}
      pke: {civilian: ML-KEM-768, cnsa2: ML-KEM-1024}
    sources: [rfc8017, sp800-57, sp800-131a]
    notes: Below the 112-bit minimum approved for new use.
  - {<<: *rsa, id: RSA-2048, params: "2048", classical_bits: 112, sizes: {public_key: 256, signature: 256, ciphertext: 256}, sources: [rfc8017, sp800-57, ir8547], notes: ""}
  - {<<: *rsa, id: RSA-3072, params: "3072", classical_bits: 128, sizes: {public_key: 384, signature: 384, ciphertext: 384}, sources: [rfc8017, sp800-57, ir8547], notes: ""}
  - {<<: *rsa, id: RSA-4096, params: "4096", classical_bits: 128, sizes: {public_key: 512, signature: 512, ciphertext: 512}, sources: [rfc8017, sp800-57, ir8547], notes: "SP 800-57 lists no 4096 row; 128 is the floor from the 3072 row."}

  # --- ECDSA ---
  - &ecdsa
    id: ECDSA-P224
    algorithm: ECDSA
    params: P-224
    curve: nist/P-224
    aliases: [secp224r1]
    primitives: [signature]
    classical_bits: 112
    quantum: vulnerable
    sizes: {public_key: 57, private_key: 28, signature: 56}
    replacement: {signature: {civilian: ML-DSA-65, cnsa2: ML-DSA-87}}
    sources: [fips186-5, sp800-57, ir8547]
    notes: Signature size is raw r||s; DER encoding is variable and larger.
  - {<<: *ecdsa, id: ECDSA-P256, params: P-256, curve: nist/P-256, aliases: [secp256r1, prime256v1, ecdsa-sha2-nistp256], classical_bits: 128, sizes: {public_key: 65, private_key: 32, signature: 64}}
  - {<<: *ecdsa, id: ECDSA-P384, params: P-384, curve: nist/P-384, aliases: [secp384r1, ecdsa-sha2-nistp384], classical_bits: 192, sizes: {public_key: 97, private_key: 48, signature: 96}}
  - {<<: *ecdsa, id: ECDSA-P521, params: P-521, curve: nist/P-521, aliases: [secp521r1, ecdsa-sha2-nistp521], classical_bits: 256, sizes: {public_key: 133, private_key: 66, signature: 132}}

  # --- ECDH ---
  - &ecdh
    id: ECDH-P256
    algorithm: ECDH
    params: P-256
    curve: nist/P-256
    aliases: [secp256r1, prime256v1, ecdh-sha2-nistp256]
    primitives: [key-agreement]
    classical_bits: 128
    quantum: vulnerable
    sizes: {public_key: 65, private_key: 32, shared_secret: 32}
    replacement: {key-agreement: {civilian: X25519MLKEM768, cnsa2: ML-KEM-1024}}
    sources: [sp800-56a, sp800-57, ir8547]
  - {<<: *ecdh, id: ECDH-P384, params: P-384, curve: nist/P-384, aliases: [secp384r1, ecdh-sha2-nistp384], classical_bits: 192, sizes: {public_key: 97, private_key: 48, shared_secret: 48}}
  - {<<: *ecdh, id: ECDH-P521, params: P-521, curve: nist/P-521, aliases: [secp521r1, ecdh-sha2-nistp521], classical_bits: 256, sizes: {public_key: 133, private_key: 66, shared_secret: 66}}

  # --- Montgomery curves ---
  - {<<: *ecdh, id: X25519, algorithm: X25519, params: X25519, curve: other/Curve25519, aliases: [curve25519, curve25519-sha256], classical_bits: 128, sizes: {public_key: 32, private_key: 32, shared_secret: 32}, sources: [rfc7748, ir8547]}
  - {<<: *ecdh, id: X448, algorithm: X448, params: X448, curve: other/Curve448, aliases: [curve448], classical_bits: 224, sizes: {public_key: 56, private_key: 56, shared_secret: 56}, sources: [rfc7748, ir8547]}

  # --- EdDSA ---
  - &eddsa
    id: Ed25519
    algorithm: EdDSA
    params: Ed25519
    curve: other/Ed25519
    aliases: [ssh-ed25519]
    primitives: [signature]
    classical_bits: 128
    quantum: vulnerable
    sizes: {public_key: 32, private_key: 32, signature: 64}
    replacement: {signature: {civilian: ML-DSA-65, cnsa2: ML-DSA-87}}
    sources: [rfc8032, fips186-5, ir8547]
  - {<<: *eddsa, id: Ed448, params: Ed448, curve: other/Ed448, aliases: [ssh-ed448], classical_bits: 224, sizes: {public_key: 57, private_key: 57, signature: 114}}

  # --- Finite-field DH and MQV ---
  - &ffdh
    id: DH-2048
    algorithm: DH
    params: "2048"
    aliases: [ffdhe2048]
    primitives: [key-agreement]
    classical_bits: 112
    quantum: vulnerable
    sizes: {public_key: 256, shared_secret: 256}
    replacement: {key-agreement: {civilian: X25519MLKEM768, cnsa2: ML-KEM-1024}}
    sources: [sp800-56a, sp800-57, rfc7919, ir8547]
  - {<<: *ffdh, id: DH-3072, params: "3072", aliases: [ffdhe3072], classical_bits: 128, sizes: {public_key: 384, shared_secret: 384}}
  - {<<: *ffdh, id: MQV, algorithm: MQV, params: unknown, aliases: [ecmqv, fhmqv], classical_bits: 0, sizes: {}, sources: [sp800-56a, ir8547], notes: Strength depends on the underlying group.}

  # --- DSA (FIPS 186-5 no longer approves DSA for signature generation) ---
  - &dsa
    id: DSA-1024
    algorithm: DSA
    params: "1024"
    primitives: [signature]
    classical_bits: 80
    quantum: vulnerable
    replacement: {signature: {civilian: ML-DSA-65, cnsa2: ML-DSA-87}}
    sources: [fips186-5, sp800-57, ir8547]
  - {<<: *dsa, id: DSA-2048, params: "2048", classical_bits: 112}
  - {<<: *dsa, id: DSA-3072, params: "3072", classical_bits: 128}

  # --- ML-KEM ---
  - &mlkem
    id: ML-KEM-512
    algorithm: ML-KEM
    params: ML-KEM-512
    aliases: [mlkem512]
    primitives: [kem]
    classical_bits: 128
    quantum: safe
    security_category: 1
    sizes: {public_key: 800, private_key: 1632, ciphertext: 768, shared_secret: 32}
    sources: [fips203]
  - {<<: *mlkem, id: ML-KEM-768, params: ML-KEM-768, aliases: [mlkem768], classical_bits: 192, security_category: 3, sizes: {public_key: 1184, private_key: 2400, ciphertext: 1088, shared_secret: 32}}
  - {<<: *mlkem, id: ML-KEM-1024, params: ML-KEM-1024, aliases: [mlkem1024], classical_bits: 256, security_category: 5, sizes: {public_key: 1568, private_key: 3168, ciphertext: 1568, shared_secret: 32}}

  # --- ML-DSA ---
  - &mldsa
    id: ML-DSA-44
    algorithm: ML-DSA
    params: ML-DSA-44
    aliases: [mldsa44]
    primitives: [signature]
    classical_bits: 128
    quantum: safe
    security_category: 2
    sizes: {public_key: 1312, private_key: 2560, signature: 2420}
    sources: [fips204]
  - {<<: *mldsa, id: ML-DSA-65, params: ML-DSA-65, aliases: [mldsa65], classical_bits: 192, security_category: 3, sizes: {public_key: 1952, private_key: 4032, signature: 3309}}
  - {<<: *mldsa, id: ML-DSA-87, params: ML-DSA-87, aliases: [mldsa87], classical_bits: 256, security_category: 5, sizes: {public_key: 2592, private_key: 4896, signature: 4627}}

  # --- SLH-DSA (SHA2 and SHAKE variants of a parameter set have equal sizes) ---
  - &slhdsa
    id: SLH-DSA-128s
    algorithm: SLH-DSA
    params: SLH-DSA-128s
    aliases: [SLH-DSA-SHA2-128s, SLH-DSA-SHAKE-128s]
    primitives: [signature]
    classical_bits: 128
    quantum: safe
    security_category: 1
    sizes: {public_key: 32, private_key: 64, signature: 7856}
    sources: [fips205]
  - {<<: *slhdsa, id: SLH-DSA-128f, params: SLH-DSA-128f, aliases: [SLH-DSA-SHA2-128f, SLH-DSA-SHAKE-128f], sizes: {public_key: 32, private_key: 64, signature: 17088}}
  - {<<: *slhdsa, id: SLH-DSA-192s, params: SLH-DSA-192s, aliases: [SLH-DSA-SHA2-192s, SLH-DSA-SHAKE-192s], classical_bits: 192, security_category: 3, sizes: {public_key: 48, private_key: 96, signature: 16224}}
  - {<<: *slhdsa, id: SLH-DSA-192f, params: SLH-DSA-192f, aliases: [SLH-DSA-SHA2-192f, SLH-DSA-SHAKE-192f], classical_bits: 192, security_category: 3, sizes: {public_key: 48, private_key: 96, signature: 35664}}
  - {<<: *slhdsa, id: SLH-DSA-256s, params: SLH-DSA-256s, aliases: [SLH-DSA-SHA2-256s, SLH-DSA-SHAKE-256s], classical_bits: 256, security_category: 5, sizes: {public_key: 64, private_key: 128, signature: 29792}}
  - {<<: *slhdsa, id: SLH-DSA-256f, params: SLH-DSA-256f, aliases: [SLH-DSA-SHA2-256f, SLH-DSA-SHAKE-256f], classical_bits: 256, security_category: 5, sizes: {public_key: 64, private_key: 128, signature: 49856}}

  # --- Hybrids ---
  - &hybrid
    id: X25519MLKEM768
    algorithm: Hybrid
    params: X25519MLKEM768
    primitives: [kem, key-agreement]
    classical_bits: 192
    quantum: hybrid
    components: [X25519, ML-KEM-768]
    sizes: {public_key: 1216, ciphertext: 1120, shared_secret: 64}
    sources: [tls-ecdhe-mlkem, fips203, rfc7748]
  - {<<: *hybrid, id: SecP256r1MLKEM768, params: SecP256r1MLKEM768, classical_bits: 192, components: [ECDH-P256, ML-KEM-768], sizes: {public_key: 1249, ciphertext: 1153, shared_secret: 64}, sources: [tls-ecdhe-mlkem, fips203]}
  - {<<: *hybrid, id: SecP384r1MLKEM1024, params: SecP384r1MLKEM1024, classical_bits: 256, components: [ECDH-P384, ML-KEM-1024], sizes: {public_key: 1665, ciphertext: 1665, shared_secret: 80}, sources: [tls-ecdhe-mlkem, fips203]}
  - {<<: *hybrid, id: mlkem768x25519-sha256, params: mlkem768x25519-sha256, classical_bits: 192, components: [X25519, ML-KEM-768], sizes: {}, sources: [ssh-mlkem, fips203, rfc7748]}
  - {<<: *hybrid, id: sntrup761x25519-sha512, params: sntrup761x25519-sha512, aliases: [sntrup761x25519-sha512@openssh.com], classical_bits: 128, components: [X25519, sntrup761], sizes: {}, sources: [ssh-ntruprime, rfc7748], notes: "sntrup761 is not a NIST standard, so this is hybrid in construction but not FIPS-approved."}
  - id: sntrup761
    algorithm: sntrup761
    params: sntrup761
    primitives: [kem]
    classical_bits: 0
    quantum: safe
    sources: [ssh-ntruprime]
    notes: Not NIST-standardized. The safe status reflects no known quantum break, not an approval.

  # --- Symmetric ciphers ---
  - &aes
    id: AES-128
    algorithm: AES
    params: "128"
    primitives: [cipher]
    classical_bits: 128
    quantum: weakened
    sources: [fips197, sp800-57, ir8547]
    notes: IR 8547 does not plan to replace AES. CNSA 2.0 requires AES-256.
  - {<<: *aes, id: AES-192, params: "192", classical_bits: 192}
  - {<<: *aes, id: AES-256, params: "256", classical_bits: 256, notes: ""}
  - {<<: *aes, id: ChaCha20-Poly1305, algorithm: ChaCha20-Poly1305, params: ChaCha20-Poly1305, aliases: [chacha20], classical_bits: 256, sources: [rfc8439], notes: ""}
  - id: 3DES
    algorithm: 3DES
    params: 3-key
    aliases: [TDEA, TDES, DESede, DES3]
    primitives: [cipher]
    classical_bits: 112
    quantum: broken-now
    replacement: {cipher: {civilian: AES-256, cnsa2: AES-256}}
    sources: [sp800-131a, sp800-57]
    notes: Disallowed for encryption after 2023.
  - id: DES
    algorithm: DES
    params: "56"
    primitives: [cipher]
    classical_bits: 56
    quantum: broken-now
    replacement: {cipher: {civilian: AES-256, cnsa2: AES-256}}
    sources: [sp800-131a]
  - id: RC4
    algorithm: RC4
    params: unknown
    aliases: [ARCFOUR]
    primitives: [cipher]
    classical_bits: 0
    quantum: broken-now
    replacement: {cipher: {civilian: AES-256, cnsa2: AES-256}}
    sources: [rfc7465]

  # --- Hashes and MACs (classical_bits is collision strength for hashes) ---
  - id: MD5
    algorithm: MD5
    params: MD5
    primitives: [hash]
    classical_bits: 0
    quantum: broken-now
    replacement: {hash: {civilian: SHA-256, cnsa2: SHA-384}}
    sources: [rfc6151]
    notes: Collisions take seconds on commodity hardware.
  - id: SHA-1
    algorithm: SHA-1
    params: SHA-1
    aliases: [SHA1]
    primitives: [hash]
    classical_bits: 63
    quantum: broken-now
    replacement: {hash: {civilian: SHA-256, cnsa2: SHA-384}}
    sources: [shattered, sp800-131a]
  - &sha2
    id: SHA-256
    algorithm: SHA-2
    params: SHA-256
    aliases: [SHA256]
    primitives: [hash]
    classical_bits: 128
    quantum: weakened
    sources: [fips180-4, sp800-57, ir8547]
  - {<<: *sha2, id: SHA-384, params: SHA-384, aliases: [SHA384], classical_bits: 192}
  - {<<: *sha2, id: SHA-512, params: SHA-512, aliases: [SHA512], classical_bits: 256}
  - {<<: *sha2, id: SHA3-256, algorithm: SHA-3, params: SHA3-256, aliases: [], classical_bits: 128, sources: [fips202, sp800-57, ir8547]}
  - {<<: *sha2, id: SHA3-512, algorithm: SHA-3, params: SHA3-512, aliases: [], classical_bits: 256, sources: [fips202, sp800-57, ir8547]}
  - &hmac
    id: HMAC-SHA-256
    algorithm: HMAC
    params: SHA-256
    aliases: [HMAC-SHA256]
    primitives: [mac]
    classical_bits: 256
    quantum: weakened
    sources: [fips198-1, sp800-57]
  - {<<: *hmac, id: HMAC-SHA-1, params: SHA-1, aliases: [HMAC-SHA1], classical_bits: 128, notes: "SHA-1 collisions do not break HMAC-SHA-1, which SP 800-131A still allows.", sources: [fips198-1, sp800-57, sp800-131a]}
  - {<<: *hmac, id: HMAC-SHA-384, params: SHA-384, aliases: [HMAC-SHA384]}
  - {<<: *hmac, id: HMAC-SHA-512, params: SHA-512, aliases: [HMAC-SHA512]}
